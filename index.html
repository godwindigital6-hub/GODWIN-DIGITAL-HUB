<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godwin Digital Hub | Build. Market. Automate. Grow.</title>
    <meta
      name="description"
      content="Godwin Digital Hub delivers website design, sales funnels, digital store setup, digital marketing, AI automation, and video editing for growing businesses."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Godwin Digital Hub" />
    <meta property="og:title" content="Godwin Digital Hub | Build. Market. Automate. Grow." />
    <meta
      property="og:description"
      content="Website design, sales funnels, digital store setup, digital marketing, AI-powered solutions, and short-form video editing for creators and businesses."
    />
    <meta property="og:image" content="/brand/godwin-og-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Godwin Digital Hub | Build. Market. Automate. Grow." />
    <meta
      name="twitter:description"
      content="Website design, sales funnels, digital store setup, digital marketing, AI-powered solutions, and short-form video editing for creators and businesses."
    />
    <meta name="twitter:image" content="/brand/godwin-og-card.svg" />
    <meta name="theme-color" content="#0B192C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/godwin-social-logo.svg" />

    <!-- Fonts: Outfit (Display) & Plus Jakarta Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (Schema.org ProfessionalService) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Godwin Digital Hub",
        "description": "Digital solutions agency helping entrepreneurs, creators, and businesses establish their online presence, build digital sales systems, strengthen marketing, produce engaging video content, and implement practical AI-powered solutions.",
        "slogan": "Build. Market. Automate. Grow.",
        "sameAs": [
          "https://www.instagram.com/godwi_ndigital/",
          "https://www.tiktok.com/@digitalsalesfix",
          "https://www.linkedin.com/in/godwin-bright-030a98408"
        ],
        "serviceType": [
          "Website Design and Development",
          "Sales Funnels and Landing Pages",
          "Digital Store Setup",
          "Digital Marketing",
          "AI Solutions and Automation",
          "Video Editing and Content Production"
        ]
      }
    </script>

    <!-- Analytics Readiness: Insert Google Analytics 4 (G-XXXXXXXXXX) & Google Search Console verification meta tag upon deployment -->
  </head>
  <body class="bg-white text-[#0B192C] antialiased selection:bg-[#C89B3C]/25 selection:text-[#0B192C]">
    <!-- Static Netlify Form Definitions for Build-Time Bot Detection -->
    <form
      name="project-enquiry"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="project-enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="full-name" />
      <input type="email" name="email" />
      <input type="text" name="business-name" />
      <select name="service-required">
        <option value="Website Design and Development">Website Design and Development</option>
        <option value="Sales Funnel Development">Sales Funnel Development</option>
        <option value="Landing Page Design">Landing Page Design</option>
        <option value="Digital Store Setup">Digital Store Setup</option>
        <option value="Digital Marketing">Digital Marketing</option>
        <option value="AI Website or Web Application">AI Website or Web Application</option>
        <option value="AI Chatbot">AI Chatbot</option>
        <option value="Automation">Automation</option>
        <option value="Video Editing and Content Production">Video Editing and Content Production</option>
        <option value="Domain Connection">Domain Connection</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" name="project-budget" />
      <input type="text" name="expected-timeline" />
      <textarea name="project-description"></textarea>
      <input type="url" name="current-website-url" />
    </form>

    <form
      name="website-audit-request"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="website-audit-request" />
      <input type="text" name="bot-field" />
      <input type="text" name="full-name" />
      <input type="email" name="email" />
      <input type="text" name="business-name" />
      <input type="url" name="website-url" />
      <input type="text" name="business-industry" />
      <input type="text" name="assessment-focus" />
      <textarea name="biggest-challenge"></textarea>
      <textarea name="additional-info"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
